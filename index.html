<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Portfolio de Marie</title>
</head>
<body class="clair">
    <h1>Bienvenue sur mon portfolio !</h1>
    <p>
        <input type="checkbox" id="themeSombre" class="themeSombre" />
        <label for="themeSombre" aria-describedby="label">Thème sombre</label>
    </p>
   
    <h2>Mes projets</h2>
    <h2>Mon CV</h2>
</body>
<script type="text/javascript"> 

// localStorage.setItem("theme", "clair")

document.querySelector(".themeSombre").addEventListener("change", function (){
    if (document.getElementById("themeSombre").checked){
        localStorage.setItem("theme", "sombre");
        changeTheme();
    }
    else{
        localStorage.setItem("theme", "clair");
        changeTheme();
    }
   
})

function changeTheme(){
    if (document.getElementById("themeSombre").checked){
        document.body.classList.remove("clair");
        document.body.classList.add("sombre");
    } 
    else{
        document.body.classList.remove("sombre");
        document.body.classList.add("clair");
    }
    

}




</script>
</html>
